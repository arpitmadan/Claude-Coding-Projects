<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Roohi" />
  <title>Roohi's Log</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fdf6f0;
      --surface:   #ffffff;
      --border:    #f0e6dc;
      --text:      #3d2c24;
      --text-soft: #9e7e6e;
      --accent:    #e8927c;
      --accent-dk: #c97360;
      --green:     #7dba8c;
      --green-dk:  #5a9e6a;
      --blue:      #7baed6;
      --blue-dk:   #5a8db8;
      --yellow:    #f5c96a;
      --radius:    16px;
      --shadow:    0 2px 16px rgba(61,44,36,0.08);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ───────────────────────────────────────────── */
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 20px 12px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-dk);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-top: 2px;
    }

    main {
      flex: 1;
      padding: 0 16px 24px;
    }

    /* ─── Screens ──────────────────────────────────────────── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ─── Cards ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      margin-bottom: 14px;
    }

    /* ─── Home Screen ──────────────────────────────────────── */
    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .big-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 16px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      box-shadow: var(--shadow);
      transition: transform 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .big-btn:active { transform: scale(0.96); box-shadow: none; }

    .big-btn .icon { font-size: 2rem; }

    .btn-log  { background: var(--accent);  grid-column: span 2; padding: 32px; }
    .btn-view { background: var(--blue); }
    .btn-export { background: var(--green); }

    /* ─── Summary Strip ────────────────────────────────────── */
    .summary-strip {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .summary-strip .label {
      font-size: 0.75rem;
      color: var(--text-soft);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .summary-row {
      display: flex;
      gap: 12px;
    }

    .summary-chip {
      flex: 1;
      text-align: center;
      background: var(--bg);
      border-radius: 10px;
      padding: 8px 4px;
    }

    .summary-chip .num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .summary-chip .lbl {
      font-size: 0.7rem;
      color: var(--text-soft);
      margin-top: 1px;
    }

    /* ─── Log Form ─────────────────────────────────────────── */
    .form-row {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .date-time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      -webkit-appearance: none;
      font-family: inherit;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ─── Toggle Buttons ───────────────────────────────────── */
    .toggle-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toggle-btn {
      padding: 10px 18px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .toggle-btn.selected-yes {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .toggle-btn.selected-no {
      background: #e8e0da;
      border-color: #e8e0da;
      color: var(--text-soft);
    }

    .toggle-btn.selected-option {
      background: var(--text);
      border-color: var(--text);
      color: white;
    }

    /* ─── Sub-options (color, size) ────────────────────────── */
    .sub-options {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: none;
    }

    .sub-options.visible { display: block; }

    .sub-label {
      font-size: 0.75rem;
      color: var(--text-soft);
      font-weight: 600;
      margin-bottom: 8px;
    }

    /* ─── Section Separator ────────────────────────────────── */
    .section-icon {
      font-size: 1.4rem;
      margin-right: 6px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    /* ─── Action Buttons ───────────────────────────────────── */
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .action-btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text-soft);
      border: 1.5px solid var(--border);
      margin-top: 10px;
    }

    /* ─── Log Table ────────────────────────────────────────── */
    .log-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .log-controls input[type="date"] {
      flex: 1;
    }

    .clear-filter-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 0.85rem;
      color: var(--text-soft);
      cursor: pointer;
      font-family: inherit;
    }

    .log-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: var(--surface);
      min-width: 420px;
    }

    thead {
      background: var(--text);
      color: white;
    }

    th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:last-child td { border-bottom: none; }

    tr:nth-child(even) td { background: var(--bg); }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .pill-feed  { background: #fde8e0; color: var(--accent-dk); }
    .pill-poop  { background: #fef3cd; color: #8a6a00; }
    .pill-pee   { background: #e0f0ff; color: var(--blue-dk); }
    .pill-no    { background: var(--border); color: var(--text-soft); }

    .delete-row {
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.8rem;
      border: none;
      background: none;
      padding: 2px 4px;
    }

    .delete-row:hover { color: #cc3333; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-soft);
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    /* ─── Toast ────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Nav ──────────────────────────────────────────────── */
    nav {
      padding: 8px 16px 20px;
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn.active-nav {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

    /* ─── Scrollable area ──────────────────────────────────── */
    .scroll-area {
      max-height: 55vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1>Roohi's Log 🌸</h1>
    <p id="header-date"></p>
  </header>

  <main>

    <!-- ── HOME ─────────────────────────────────────── -->
    <div id="screen-home" class="screen active">

      <div id="summary-card" class="summary-strip">
        <div class="label">Today at a glance</div>
        <div class="summary-row">
          <div class="summary-chip">
            <div class="num" id="sum-feeds">0</div>
            <div class="lbl">Feeds</div>
          </div>
          <div class="summary-chip">
            <div class="num" id="sum-poops">0</div>
            <div class="lbl">Poops</div>
          </div>
          <div class="summary-chip">
            <div class="num" id="sum-pees">0</div>
            <div class="lbl">Pees</div>
          </div>
          <div class="summary-chip">
            <div class="num" id="sum-last">—</div>
            <div class="lbl">Last fed</div>
          </div>
        </div>
      </div>

      <div class="home-grid">
        <button class="big-btn btn-log" onclick="showScreen('log')">
          <span class="icon">➕</span>
          Log Activity
        </button>
        <button class="big-btn btn-view" onclick="showScreen('view')">
          <span class="icon">📋</span>
          View Log
        </button>
        <button class="big-btn btn-export" onclick="exportCSV()">
          <span class="icon">📤</span>
          Export CSV
        </button>
      </div>

    </div>

    <!-- ── LOG FORM ──────────────────────────────────── -->
    <div id="screen-log" class="screen">

      <div class="card">
        <div class="card-title">When?</div>
        <div class="date-time-row">
          <div>
            <label class="form-label">Date</label>
            <input type="date" id="log-date" />
          </div>
          <div>
            <label class="form-label">Time</label>
            <input type="time" id="log-time" />
          </div>
        </div>
      </div>

      <!-- Feed -->
      <div class="card">
        <div class="section-heading"><span class="section-icon">🍼</span> Feeding</div>
        <div class="form-row">
          <div class="toggle-group" id="feed-toggle">
            <button class="toggle-btn" onclick="selectToggle('feed', 'Regular', this)">Regular</button>
            <button class="toggle-btn" onclick="selectToggle('feed', 'Snack', this)">Snack</button>
            <button class="toggle-btn" onclick="selectToggle('feed', 'Top-up', this)">Top-up</button>
            <button class="toggle-btn" onclick="selectToggle('feed', 'No', this)">No feed</button>
          </div>
        </div>
      </div>

      <!-- Poop -->
      <div class="card">
        <div class="section-heading"><span class="section-icon">💩</span> Poop</div>
        <div class="form-row">
          <div class="toggle-group" id="poop-yesno">
            <button class="toggle-btn" onclick="selectYesNo('poop', true, this)">Yes</button>
            <button class="toggle-btn" onclick="selectYesNo('poop', false, this)">No</button>
          </div>

          <div class="sub-options" id="poop-sub">
            <div class="sub-label">Color</div>
            <div class="toggle-group" id="poop-color" style="margin-bottom: 12px;">
              <button class="toggle-btn" onclick="selectOption('poop-color', 'Black-green', this)">Black-green</button>
              <button class="toggle-btn" onclick="selectOption('poop-color', 'Yellow', this)">Yellow</button>
              <button class="toggle-btn" onclick="selectOption('poop-color', 'Brown', this)">Brown</button>
              <button class="toggle-btn" onclick="selectOption('poop-color', 'Green', this)">Green</button>
            </div>
            <div class="sub-label">Amount</div>
            <div class="toggle-group" id="poop-size">
              <button class="toggle-btn" onclick="selectOption('poop-size', 'Small', this)">Small</button>
              <button class="toggle-btn" onclick="selectOption('poop-size', 'Medium', this)">Medium</button>
              <button class="toggle-btn" onclick="selectOption('poop-size', 'Large', this)">Large</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Pee -->
      <div class="card">
        <div class="section-heading"><span class="section-icon">💧</span> Pee</div>
        <div class="form-row">
          <div class="toggle-group" id="pee-yesno">
            <button class="toggle-btn" onclick="selectYesNo('pee', true, this)">Yes</button>
            <button class="toggle-btn" onclick="selectYesNo('pee', false, this)">No</button>
          </div>

          <div class="sub-options" id="pee-sub">
            <div class="sub-label">Amount</div>
            <div class="toggle-group" id="pee-size">
              <button class="toggle-btn" onclick="selectOption('pee-size', 'Small', this)">Small</button>
              <button class="toggle-btn" onclick="selectOption('pee-size', 'Medium', this)">Medium</button>
              <button class="toggle-btn" onclick="selectOption('pee-size', 'Big', this)">Big</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="card">
        <div class="section-heading"><span class="section-icon">📝</span> Notes <span style="font-size:0.8rem; font-weight:400; color:var(--text-soft)">(optional)</span></div>
        <textarea id="log-notes" rows="2"
          style="width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--border);
                 font-family:inherit; font-size:0.95rem; resize:none; background:var(--bg); color:var(--text);"
          placeholder="Any extra notes…"></textarea>
      </div>

      <button class="action-btn btn-primary" onclick="saveEntry()">Save Entry</button>
      <button class="action-btn btn-secondary" onclick="showScreen('home')">Cancel</button>

    </div>

    <!-- ── VIEW LOG ──────────────────────────────────── -->
    <div id="screen-view" class="screen">

      <div class="log-controls">
        <input type="date" id="filter-date" oninput="renderTable()" />
        <button class="clear-filter-btn" onclick="clearFilter()">All</button>
      </div>

      <div class="log-table-wrap">
        <div class="scroll-area">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Feed</th>
                <th>Poop</th>
                <th>Pee</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="log-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <nav>
    <button class="nav-btn active-nav" id="nav-home" onclick="showScreen('home')">Home</button>
    <button class="nav-btn" id="nav-log" onclick="showScreen('log')">Log</button>
    <button class="nav-btn" id="nav-view" onclick="showScreen('view')">History</button>
  </nav>
</div>

<div id="toast"></div>

<script>
  // ─── State ───────────────────────────────────────────────
  const state = {
    feed: null,
    poop: null,
    poopColor: null,
    poopSize: null,
    pee: null,
    peeSize: null,
  };

  // ─── Storage ──────────────────────────────────────────────
  function getEntries() {
    return JSON.parse(localStorage.getItem('roohi-entries') || '[]');
  }

  function saveEntries(entries) {
    localStorage.setItem('roohi-entries', JSON.stringify(entries));
  }

  // ─── Screen Navigation ────────────────────────────────────
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('nav-' + name)?.classList.add('active-nav');

    if (name === 'home') updateSummary();
    if (name === 'log') resetForm();
    if (name === 'view') renderTable();
  }

  // ─── Form Logic ───────────────────────────────────────────
  function resetForm() {
    const now = new Date();
    document.getElementById('log-date').value = toDateString(now);
    document.getElementById('log-time').value = toTimeString(now);
    document.getElementById('log-notes').value = '';

    // Reset state
    Object.keys(state).forEach(k => state[k] = null);

    // Reset all toggle buttons
    document.querySelectorAll('.toggle-btn').forEach(b => {
      b.className = 'toggle-btn';
    });

    // Hide sub-options
    document.getElementById('poop-sub').classList.remove('visible');
    document.getElementById('pee-sub').classList.remove('visible');
  }

  function selectToggle(field, value, btn) {
    state[field] = value;
    const group = document.getElementById(field + '-toggle');
    group.querySelectorAll('.toggle-btn').forEach(b => b.className = 'toggle-btn');
    btn.className = value === 'No' ? 'toggle-btn selected-no' : 'toggle-btn selected-yes';
  }

  function selectYesNo(field, yes, btn) {
    state[field] = yes;
    const group = document.getElementById(field + '-yesno');
    group.querySelectorAll('.toggle-btn').forEach(b => b.className = 'toggle-btn');
    btn.className = yes ? 'toggle-btn selected-yes' : 'toggle-btn selected-no';
    document.getElementById(field + '-sub').classList.toggle('visible', yes);
    if (!yes) {
      state[field + 'Color'] = null;
      state[field + 'Size'] = null;
    }
  }

  function selectOption(groupId, value, btn) {
    const key = groupId.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    // map 'poopColor' etc
    const fieldMap = { 'poopColor': 'poopColor', 'poopSize': 'poopSize', 'peeSize': 'peeSize' };
    const stateKey = {
      'poop-color': 'poopColor',
      'poop-size':  'poopSize',
      'pee-size':   'peeSize',
    }[groupId];
    state[stateKey] = value;

    const group = document.getElementById(groupId);
    group.querySelectorAll('.toggle-btn').forEach(b => b.className = 'toggle-btn');
    btn.className = 'toggle-btn selected-option';
  }

  // ─── Save Entry ───────────────────────────────────────────
  function saveEntry() {
    const date = document.getElementById('log-date').value;
    const time = document.getElementById('log-time').value;

    if (!date || !time) {
      showToast('Please set date and time');
      return;
    }

    const entry = {
      id: Date.now(),
      date,
      time,
      feed: state.feed,
      poop: state.poop,
      poopColor: state.poopColor,
      poopSize: state.poopSize,
      pee: state.pee,
      peeSize: state.peeSize,
      notes: document.getElementById('log-notes').value.trim(),
    };

    const entries = getEntries();
    entries.push(entry);
    // Sort by date+time
    entries.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    saveEntries(entries);

    showToast('Saved!');
    showScreen('home');
  }

  // ─── Summary ──────────────────────────────────────────────
  function updateSummary() {
    const today = toDateString(new Date());
    const entries = getEntries().filter(e => e.date === today);

    document.getElementById('sum-feeds').textContent =
      entries.filter(e => e.feed && e.feed !== 'No').length;
    document.getElementById('sum-poops').textContent =
      entries.filter(e => e.poop === true).length;
    document.getElementById('sum-pees').textContent =
      entries.filter(e => e.pee === true).length;

    const fed = entries.filter(e => e.feed && e.feed !== 'No');
    document.getElementById('sum-last').textContent =
      fed.length ? fed[fed.length - 1].time : '—';
  }

  // ─── Table ────────────────────────────────────────────────
  function renderTable() {
    const filter = document.getElementById('filter-date').value;
    let entries = getEntries();
    if (filter) entries = entries.filter(e => e.date === filter);
    entries = [...entries].reverse(); // newest first

    const tbody = document.getElementById('log-tbody');

    if (entries.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6">
        <div class="empty-state">
          <div class="icon">📭</div>
          <div>No entries yet</div>
        </div>
      </td></tr>`;
      return;
    }

    tbody.innerHTML = entries.map(e => {
      const feedHtml = e.feed && e.feed !== 'No'
        ? `<span class="pill pill-feed">${e.feed}</span>`
        : `<span class="pill pill-no">No</span>`;

      let poopHtml = '';
      if (e.poop === true) {
        const parts = [e.poopColor, e.poopSize].filter(Boolean).join(', ');
        poopHtml = `<span class="pill pill-poop">Yes${parts ? ' · ' + parts : ''}</span>`;
      } else if (e.poop === false) {
        poopHtml = `<span class="pill pill-no">No</span>`;
      } else {
        poopHtml = `<span style="color:var(--text-soft)">—</span>`;
      }

      let peeHtml = '';
      if (e.pee === true) {
        peeHtml = `<span class="pill pill-pee">Yes${e.peeSize ? ' · ' + e.peeSize : ''}</span>`;
      } else if (e.pee === false) {
        peeHtml = `<span class="pill pill-no">No</span>`;
      } else {
        peeHtml = `<span style="color:var(--text-soft)">—</span>`;
      }

      const dateLabel = formatDate(e.date);

      return `<tr>
        <td style="white-space:nowrap;font-weight:600">${dateLabel}</td>
        <td style="white-space:nowrap">${formatTime(e.time)}</td>
        <td>${feedHtml}</td>
        <td>${poopHtml}</td>
        <td>${peeHtml}</td>
        <td><button class="delete-row" onclick="deleteEntry(${e.id})" title="Delete">✕</button></td>
      </tr>`;
    }).join('');
  }

  function clearFilter() {
    document.getElementById('filter-date').value = '';
    renderTable();
  }

  function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    saveEntries(getEntries().filter(e => e.id !== id));
    renderTable();
    updateSummary();
  }

  // ─── Export CSV ───────────────────────────────────────────
  function exportCSV() {
    const entries = getEntries();
    if (entries.length === 0) { showToast('No data to export'); return; }

    const headers = ['Date','Time','Feed','Poop','Poop Color','Poop Size','Pee','Pee Size','Notes'];
    const rows = entries.map(e => [
      e.date,
      e.time,
      e.feed || '',
      e.poop === true ? 'Yes' : e.poop === false ? 'No' : '',
      e.poopColor || '',
      e.poopSize || '',
      e.pee === true ? 'Yes' : e.pee === false ? 'No' : '',
      e.peeSize || '',
      e.notes || '',
    ]);

    const csv = [headers, ...rows]
      .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `roohi-log-${toDateString(new Date())}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported!');
  }

  // ─── Helpers ──────────────────────────────────────────────
  function toDateString(d) {
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, '0'),
      String(d.getDate()).padStart(2, '0'),
    ].join('-');
  }

  function toTimeString(d) {
    return [
      String(d.getHours()).padStart(2, '0'),
      String(d.getMinutes()).padStart(2, '0'),
    ].join(':');
  }

  function formatDate(dateStr) {
    const [y, m, day] = dateStr.split('-').map(Number);
    const d = new Date(y, m - 1, day);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function formatTime(timeStr) {
    const [h, min] = timeStr.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    return `${h12}:${String(min).padStart(2, '0')} ${ampm}`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ─── Init ─────────────────────────────────────────────────
  (function init() {
    const now = new Date();
    document.getElementById('header-date').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    updateSummary();
  })();
</script>
</body>
</html>
